<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Control Center</title><meta name="description" content="X/Twitter account analyzer and unfollow dashboard using X OAuth 2.0 PKCE and Express."><meta property="og:title" content="X Control Center"><meta property="og:description" content="X/Twitter account analyzer and unfollow dashboard using X OAuth 2.0 PKCE and Express."><style>
:root{--bg:#fff;--text:#0f172a;--muted:#64748b;--line:#e5e7eb;--soft:#f8fafc;--accent:#0f172a;--danger:#ef4444;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.container{max-width:1280px;margin:auto;padding:28px}.login{min-height:100vh;display:grid;place-items:center;background:#f8fafc}.login-card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 18px 60px #0f172a12;text-align:center}.xmark{width:54px;height:54px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-weight:800;font-size:22px}.login h1{margin:0 0 8px;font-size:28px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:9px;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.danger{color:var(--danger);border-color:#fca5a5;background:#fff}.btn.danger:hover{background:#fff5f5}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.brand{font-weight:800;font-size:20px}.account-mini{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e2e8f0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}.card .label{color:var(--muted);font-size:12px}.card .value{font-size:26px;font-weight:750;margin-top:7px}.profile{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.profile-main{display:flex;gap:15px;align-items:center}.profile .avatar{width:68px;height:68px}.profile h2{margin:0 0 2px}.profile p{margin:4px 0;color:var(--muted)}.analysis{margin:22px 0}.analysis-box{display:flex;gap:18px;flex-wrap:wrap}.metric{background:var(--soft);border-radius:12px;padding:14px 18px;min-width:170px}.metric b{display:block;font-size:22px;margin-top:5px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filter{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px}.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;width:280px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0}.table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{height:58px;text-align:left;color:#718096;font-size:12px;letter-spacing:1.3px;padding:0 18px;border-bottom:1px solid var(--line)}.table td{padding:14px 18px;border-bottom:1px solid #f1f5f9;vertical-align:middle}.table tr:last-child td{border-bottom:0}.usercell{display:flex;align-items:center;gap:12px;min-width:250px}.usercell .avatar{width:40px;height:40px}.name{font-weight:700}.handle{color:#64748b;font-size:13px;margin-top:2px}.actions{display:flex;gap:8px}.eye{width:40px;padding:9px}.selectedbar{position:sticky;bottom:12px;background:#111;color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px #0003;margin-top:10px}.selectedbar .btn{background:#fff;color:#111}.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;color:#1e40af;margin:12px 0}.error{padding:12px 14px;background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;color:#9f1239;margin:12px 0}.modal{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(520px,100%);background:#fff;border-radius:16px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.profile-detail{display:flex;gap:14px;align-items:center;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--soft);padding:12px;border-radius:10px}.stat span{display:block;color:var(--muted);font-size:12px}.footer-note{margin-top:18px;color:#94a3b8;font-size:12px}@media(max-width:800px){.container{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.profile{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.topbar{align-items:flex-start}.brand{font-size:18px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.card .value{font-size:21px}.login-card{padding:26px}}
</style></head><body>
<div id="app"></div>
<script>
const app=document.getElementById('app');let state={account:null,data:[],selected:new Set(),loading:false,error:'',query:'',sort:'followers'};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=n=>n==null?'Unavailable':Number(n).toLocaleString();
const age=d=>{if(!d)return'Unavailable';const x=Math.floor((Date.now()-new Date(d))/86400000);return x===1?'1 day ago':x+' days ago'};
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}
function login(){app.innerHTML=`<div class="login"><div class="login-card"><div class="xmark">X</div><h1>X Control Center</h1><p class="muted">Connect your X account to analyze followers, following and manage unfollows.</p><div style="height:18px"></div><a class="btn primary" style="display:block;text-decoration:none" href="/api/auth/x/start">Continue with X</a><p class="footer-note">Authentication is handled by X OAuth. Your X password is never requested by this app.</p></div></div>`}
async function boot(){try{const d=await api('/api/auth/me');state.account=d.account;renderShell();await loadAnalysis()}catch{login()}}
function renderShell(){app.innerHTML=`<div class="container"><div class="topbar"><div class="brand">X Control Center</div><div class="account-mini"><img class="avatar" src="${esc(state.account.profile_image_url)}"><div><b>${esc(state.account.name)}</b><div class="muted">@${esc(state.account.username)}</div></div><button class="btn" id="logout">Logout</button></div></div><div id="content"></div></div>`;document.getElementById('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()}}
async function loadAnalysis(){state.loading=true;render();try{const d=await api('/api/analysis/not-following-back');state.data=d.data||[];state.analysis=d;state.account=state.account||{};render()}catch(e){state.error=e.message;render()}finally{state.loading=false}}
function render(){const c=document.getElementById('content');if(!c)return;const a=state.account||{};const q=state.query.toLowerCase();let rows=state.data.filter(x=>(x.name+' '+x.username).toLowerCase().includes(q));if(state.sort==='followers')rows.sort((a,b)=>(b.followers_count||0)-(a.followers_count||0));if(state.sort==='following')rows.sort((a,b)=>(b.following_count||0)-(a.following_count||0));if(state.sort==='posts')rows.sort((a,b)=>(b.tweet_count||0)-(a.tweet_count||0));c.innerHTML=`<div class="profile"><div class="profile-main"><img class="avatar" src="${esc(a.profile_image_url)}"><div><h2>${esc(a.name)}</h2><p>@${esc(a.username)}</p><p>${esc(a.description||'')}</p></div></div><div><button class="btn" id="refresh">Refresh Data</button> <a class="btn" target="_blank" href="https://x.com/${encodeURIComponent(a.username)}">Open X</a></div></div><div class="cards"><div class="card"><div class="label">FOLLOWERS</div><div class="value">${fmt(a.followers_count)}</div></div><div class="card"><div class="label">FOLLOWING</div><div class="value">${fmt(a.following_count)}</div></div><div class="card"><div class="label">TOTAL POSTS</div><div class="value">${fmt(a.tweet_count)}</div></div><div class="card"><div class="label">TOTAL LIKES</div><div class="value">Not available</div></div></div><div class="analysis"><h2>Following Analysis</h2><div class="analysis-box"><div class="metric">Total Following<b>${fmt(state.analysis?.followingCount)}</b></div><div class="metric">Followers<b>${fmt(state.analysis?.followerCount)}</b></div><div class="metric">Mutuals<b>${fmt(state.analysis?.mutuals)}</b></div><div class="metric">Not Following Back<b>${fmt(state.analysis?.total)}</b></div></div></div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}<div class="toolbar"><div><h2 style="margin:0">Not Following Back</h2><span class="muted">Accounts you follow who do not follow you back.</span></div><div style="display:flex;gap:8px"><input id="search" class="search" placeholder="Search name or @username" value="${esc(state.query)}"><button class="btn" id="refresh2">Refresh</button></div></div><div class="filters"><button class="filter">Eggheads ▾</button><button class="filter">Verified ▾</button><button class="filter">Fake/Spam ▾</button><button class="filter">Inactive ▾</button><button class="filter">Overactive ▾</button><button class="filter" id="joinSort">Join Date ▾</button><button class="filter">Language ▾</button><button class="filter" id="followerSort">Followers ▾</button><button class="filter" id="friendSort">Friends ▾</button><button class="filter" id="postSort">Posts ▾</button></div><div class="table-wrap"><table class="table"><thead><tr><th><input type="checkbox" id="all"></th><th>NAME</th><th>TWEETS</th><th>JOINED</th><th>FRIENDS</th><th>FOLLOWERS</th><th>ACTIONS</th></tr></thead><tbody>${state.loading?Array.from({length:8},()=>`<tr><td colspan="7">Loading...</td></tr>`).join(''):rows.map(x=>`<tr><td><input type="checkbox" class="rowcheck" data-id="${x.id}" ${state.selected.has(x.id)?'checked':''}></td><td><div class="usercell"><img class="avatar" src="${esc(x.profile_image_url)}"><div><div class="name">${esc(x.name)} ${x.verified?'✓':''}</div><div class="handle">@${esc(x.username)}</div></div></div></td><td>${fmt(x.tweet_count)}</td><td>${age(x.created_at)}</td><td>${fmt(x.following_count)}</td><td>${fmt(x.followers_count)}</td><td><div class="actions"><button class="btn eye" data-view="${x.id}">◉</button><button class="btn danger" data-unfollow="${x.id}">♙ Unfollow</button></div></td></tr>`).join('')}</tbody></table></div>${state.selected.size?`<div class="selectedbar"><span>${state.selected.size} selected</span><div><button class="btn" id="clear">Clear</button> <button class="btn danger" id="bulk">Unfollow Selected</button></div></div>`:''}<p class="footer-note">Data comes from the authenticated X account. X API availability, permissions and usage costs depend on your X Developer access.</p>`;
bind();}
function bind(){document.querySelectorAll('.rowcheck').forEach(el=>el.onchange=()=>{el.checked?state.selected.add(el.dataset.id):state.selected.delete(el.dataset.id);render()});const all=document.getElementById('all');if(all)all.onchange=()=>{document.querySelectorAll('.rowcheck').forEach(el=>el.checked?state.selected.add(el.dataset.id):state.selected.delete(el.dataset.id));render()};const s=document.getElementById('search');if(s)s.oninput=()=>{state.query=s.value;render()};document.getElementById('refresh')?.addEventListener('click',loadAnalysis);document.getElementById('refresh2')?.addEventListener('click',loadAnalysis);document.getElementById('clear')?.addEventListener('click',()=>{state.selected.clear();render()});document.getElementById('bulk')?.addEventListener('click',bulk);document.getElementById('followerSort')?.addEventListener('click',()=>{state.sort='followers';render()});document.getElementById('friendSort')?.addEventListener('click',()=>{state.sort='following';render()});document.getElementById('postSort')?.addEventListener('click',()=>{state.sort='posts';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll('[data-unfollow]').forEach(b=>b.onclick=()=>unfollow(b.dataset.unfollow));}
async function view(id){try{const d=await api('/api/profile/'+id);const x=d.account;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Profile</h2><button class="btn" id="close">Close</button></div><div class="profile-detail"><img class="avatar" style="width:64px;height:64px" src="${esc(x.profile_image_url)}"><div><h2 style="margin:0">${esc(x.name)}</h2><div class="muted">@${esc(x.username)}</div></div></div><p>${esc(x.description||'')}</p><div class="stats"><div class="stat"><span>Followers</span><b>${fmt(x.followers_count)}</b></div><div class="stat"><span>Following</span><b>${fmt(x.following_count)}</b></div><div class="stat"><span>Posts</span><b>${fmt(x.tweet_count)}</b></div></div><div style="margin-top:18px"><a class="btn" target="_blank" href="https://x.com/${encodeURIComponent(x.username)}">Open on X</a> <button class="btn danger" id="muf">Unfollow</button></div></div>`;document.body.appendChild(m);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#muf').onclick=async()=>{m.remove();await unfollow(id)}}catch(e){alert(e.message)}}
async function unfollow(id){const x=state.data.find(u=>u.id===id);if(!confirm(`Unfollow @${x?.username||id}?`))return;try{await api('/api/unfollow/'+id,{method:'POST'});state.data=state.data.filter(u=>u.id!==id);state.selected.delete(id);render()}catch(e){alert(e.message)}}
async function bulk(){const ids=[...state.selected];if(!confirm(`Unfollow ${ids.length} selected accounts?`))return;try{const d=await api('/api/unfollow-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});const ok=new Set(d.results.filter(x=>x.ok).map(x=>x.id));state.data=state.data.filter(x=>!ok.has(x.id));ok.forEach(id=>state.selected.delete(id));render();alert(`Successful: ${ok.size}\nFailed: ${d.results.length-ok.size}`)}catch(e){alert(e.message)}}
boot();
</script></body></html>
